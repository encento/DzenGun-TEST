<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobScout</title><style>
:root{--bg:#f5f7f3;--card:#fff;--ink:#15221c;--muted:#68736e;--line:#dbe2dd;--green:#1d7052;--soft:#e1f3e9;--red:#a54840}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}a{color:inherit}.wrap{max-width:1080px;margin:auto;padding:0 20px}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900;letter-spacing:-.04em}.brand b{color:var(--green)}button,.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--ink);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.hero{padding:76px 0 90px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}h1{font-size:64px;line-height:.96;letter-spacing:-.06em;margin:12px 0 24px}h2{font-size:36px;letter-spacing:-.04em;margin:8px 0 16px}.lead{font-size:18px;color:var(--muted);max-width:680px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(30,50,42,.06)}.mockrow,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{color:var(--green);font-weight:900}.muted{color:var(--muted)}.section{padding:66px 0;background:#fff;border-top:1px solid var(--line)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth .panel{width:min(430px,100%)}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}.input,textarea{width:100%;padding:11px 12px;border:1px solid #cdd7d1;border-radius:10px;background:#fff;font:inherit}textarea{min-height:110px}.msg{font-size:13px;margin-top:10px}.error{color:var(--red)}.ok{color:var(--green)}.onboard{max-width:760px;margin:auto;padding:40px 20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span{grid-column:1/-1}.appbar{position:sticky;top:0;background:rgba(245,247,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:10}.appbar .wrap{height:66px;display:flex;justify-content:space-between;align-items:center}.appmain{display:grid;grid-template-columns:190px 1fr;gap:24px;padding-top:26px}.side button{width:100%;text-align:left;background:transparent;color:var(--muted);margin:2px 0}.side button.active{background:#fff;color:var(--ink)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:22px}.toolbar{display:flex;gap:10px;margin:16px 0}.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;margin:11px 0}.job h3{font-size:20px;margin:5px 0}.meta{font-size:12px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.desc{color:#4f5d56}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;background:#f0f4f1;border-radius:999px;padding:5px 8px}.match{background:#f2f9f5;border-radius:11px;padding:11px;margin:12px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions .btn{font-size:13px;padding:8px 10px}.soft{background:var(--soft);color:var(--green)}.modalbg{position:fixed;inset:0;background:#10231b66;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;border-radius:17px;padding:20px;width:min(650px,100%);max-height:88vh;overflow:auto}.modal pre{white-space:pre-wrap;font:inherit;background:#f4f7f5;padding:14px;border-radius:10px}.hide{display:none}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .panel{display:none}h1{font-size:48px}.grid3{grid-template-columns:1fr}.appmain{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.summary{grid-template-columns:1fr 1fr}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.span{grid-column:auto}.toolbar{flex-direction:column}}
</style></head><body><div id="root"></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm';
const sb=createClient('https://rpgphhndvurcgnzfrwwk.supabase.co','sb_publishable_Kojl3btOQ3yv7PBg4AqQMA_r9NI4q5r',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),root=document.querySelector('#root');
let S={user:null,profile:null,jobs:[],stats:{},filter:'all',q:''};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=d=>{if(!d)return'unknown';let m=Math.max(0,Math.floor((Date.now()-new Date(d))/6e4));return m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'};
const toks=v=>[...new Set(String(v||'').toLowerCase().replace(/[^a-z0-9+#.\- ]/g,' ').split(/\s+/).filter(x=>x.length>2))];
function score(j,p){let body=new Set(toks(j.title+' '+j.description+' '+(j.skills||[]).join(' '))),roles=toks(p?.target_roles),skills=toks(p?.skills),hits=[...roles,...skills].filter(x=>body.has(x)),n=35+Math.min(45,hits.length*7);if(j.source_published_at&&(Date.now()-new Date(j.source_published_at))<864e5)n+=10;if(p?.min_budget&&j.budget_max)n+=j.budget_max>=p.min_budget?5:-10;n=Math.max(10,Math.min(99,n));return{...j,score:n,label:n>=80?'Strong':n>=60?'Good':'Weak',why:hits.length?'Matches '+[...new Set(hits)].slice(0,5).join(', '):'Fresh opportunity; profile overlap needs a manual check.'}}
async function user(){let{data:{user}}=await sb.auth.getUser();if(!user)throw Error('Unauthorized');S.user=user;return user}async function track(n,p={}){try{let u=await user();await sb.from('product_events').insert({user_id:u.id,event_name:n,properties:p})}catch{}}
async function getProfile(){let u=await user(),{data,error}=await sb.from('profiles').select('*').eq('user_id',u.id).maybeSingle();if(error)throw error;S.profile=data;return data}
async function saveProfile(b){let u=await user(),row={user_id:u.id,name:b.name||'',target_roles:b.target_roles||'',skills:b.skills||'',profile_text:b.profile_text||'',portfolio_url:b.portfolio_url||'',min_compensation:'',min_budget:b.min_budget?Number(b.min_budget):null,languages:b.languages||[],geography:b.geography||'Remote',blacklist:b.blacklist||'',onboarding_completed:true,updated_at:new Date().toISOString()},{data,error}=await sb.from('profiles').upsert(row,{onConflict:'user_id'}).select('*').single();if(error)throw error;S.profile=data;track('preferences_saved');return data}
async function loadJobs(force=false){let u=await user(),r=await fetch('/api/jobs'+(force?'?refresh=1':'')),raw=await r.json();if(!r.ok)throw Error(raw.error||'Job feed failed');let[{data:a},{count}]=await Promise.all([sb.from('job_actions').select('job_key,status,reason').eq('user_id',u.id),sb.from('proposals').select('id',{head:true,count:'exact'}).eq('user_id',u.id)]),am=Object.fromEntries((a||[]).map(x=>[x.job_key,x]));S.jobs=(raw.jobs||[]).map((j,i)=>({...score(j,S.profile||{}),id:i+1,action:am[j.source+':'+j.source_job_id]||null})).sort((a,b)=>b.score-a.score);let t=new Date();t.setUTCHours(0,0,0,0);S.stats={today:S.jobs.filter(j=>j.source_published_at&&new Date(j.source_published_at)>=t).length,strong:S.jobs.filter(j=>j.label==='Strong').length,good:S.jobs.filter(j=>j.label==='Good').length,proposals:count||0,sources:(raw.sources||[]).filter(x=>x.ok)};track('job_feed_loaded',{count:S.jobs.length});}
async function action(id,status){let u=await user(),j=S.jobs.find(x=>x.id===id),reason=status==='dismissed'?(prompt('Why not for you? (optional)')||null):null,row={user_id:u.id,job_key:j.source+':'+j.source_job_id,source:j.source,title:j.title,url:j.url,status,reason,updated_at:new Date().toISOString()},{data,error}=await sb.from('job_actions').upsert(row,{onConflict:'user_id,job_key'}).select('*').single();if(error)throw error;j.action=data;track(status,{source:j.source});renderFeed()}
function proposalText(j,tone='professional'){let p=S.profile||{},list=String(p.skills||'').split(/[,;|]/).map(x=>x.trim()).filter(Boolean),hay=(j.title+' '+j.description).toLowerCase(),rel=list.filter(x=>hay.includes(x.toLowerCase())).slice(0,4),open=tone==='casual'?'Hi — this caught my eye.':'Hi,',fit=rel.length?'The strongest overlap is '+rel.join(', ')+'.':'My background in '+(p.target_roles||'freelance work')+' matches the outcome you’re hiring for.',bio=String(p.profile_text||'').replace(/\s+/g,' ').slice(0,360),close='If useful, I can suggest a concrete first step after a quick look at your current setup.',parts=[open,'I’m interested in '+j.title+(j.company?' at '+j.company:'')+'.',fit,bio?bio:'I focus on practical delivery, clear communication and fast feedback.',p.portfolio_url?'Portfolio: '+p.portfolio_url:'',close,p.name?'— '+p.name:''].filter(Boolean);return tone==='short'?[parts[0],parts[1],fit,close,p.name?'— '+p.name:''].filter(Boolean).join('\n\n'):parts.join('\n\n')}
async function makeProposal(id,tone='professional'){let u=await user(),j=S.jobs.find(x=>x.id===id),body=proposalText(j,tone),{data,error}=await sb.from('proposals').insert({user_id:u.id,job_id:null,job_key:j.source+':'+j.source_job_id,job_title:j.title,job_url:j.url,body,tone}).select('*').single();if(error)throw error;track('proposal_generated',{source:j.source});return data}
function landing(){root.innerHTML=`<div class="wrap"><div class="nav"><div class="brand">Job<b>Scout</b></div><div><a class="btn ghost" href="#login">Log in</a> <a class="btn primary" href="#signup">Start free</a></div></div><div class="hero"><div><div class="eyebrow">Fresh jobs, ranked for you</div><h1>Stop hunting for work.</h1><p class="lead">JobScout watches live sources, scores each opportunity against your profile, and puts the strongest matches in one feed.</p><p><a class="btn green" href="#signup">Build my radar — free</a></p><p class="muted">Live Jobicy + Remote OK · Original link on every card</p></div><div class="panel"><div class="mockrow"><b>Your radar</b><span class="score">● Live</span></div><hr><div class="mockrow"><span>Senior Product Designer<br><small class="muted">Jobicy · 8m ago</small></span><span class="score">94%</span></div><hr><div class="mockrow"><span>Lead Product Designer<br><small class="muted">Remote OK · 21m ago</small></span><span class="score">86%</span></div></div></div></div><div class="section"><div class="wrap"><div class="eyebrow">How it works</div><h2>One profile. One ranked feed.</h2><div class="grid3"><div class="card"><b>1. Profile</b><p class="muted">Roles, skills, budget, bio and hard-no keywords.</p></div><div class="card"><b>2. Live scan</b><p class="muted">Two public sources normalized into one feed.</p></div><div class="card"><b>3. Act</b><p class="muted">Save, dismiss, mark applied or generate a proposal.</p></div></div></div></div>`}
function auth(mode){root.innerHTML=`<div class="auth"><div class="panel"><div class="brand">Job<b>Scout</b></div><h2>${mode==='signup'?'Create account':'Welcome back'}</h2><form id="f"><label>Email</label><input class="input" name="email" type="email" required><label>Password</label><input class="input" name="password" type="password" minlength="6" required><button class="btn green" style="width:100%;margin-top:16px">${mode==='signup'?'Sign up':'Log in'}</button><div id="m" class="msg"></div></form><p class="muted">${mode==='signup'?'Already have an account? <a href="#login">Log in</a>':'No account? <a href="#signup">Sign up</a>'}</p></div></div>`;document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),email=f.get('email'),password=f.get('password'),m=document.querySelector('#m');try{if(mode==='signup'){let{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error)throw error;if(!data.session){m.className='msg ok';m.textContent='Check your email to confirm, then return and log in.';return}}else{let{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}await route()}catch(x){m.className='msg error';m.textContent=x.message}}}
function onboarding(edit=false){let p=S.profile||{};root.innerHTML=`<div class="onboard"><div class="brand">Job<b>Scout</b></div><h2>${edit?'Edit your radar':'What work should we find?'}</h2><form id="pf" class="panel formgrid"><div><label>Name</label><input class="input" name="name" value="${esc(p.name)}"></div><div><label>Target roles</label><input class="input" name="target_roles" value="${esc(p.target_roles)}" required placeholder="Product Designer"></div><div class="span"><label>Skills</label><input class="input" name="skills" value="${esc(p.skills)}" required placeholder="Figma, SaaS, UX research"></div><div class="span"><label>Bio / experience</label><textarea name="profile_text">${esc(p.profile_text)}</textarea></div><div><label>Portfolio URL</label><input class="input" name="portfolio_url" value="${esc(p.portfolio_url)}"></div><div><label>Minimum budget / salary</label><input class="input" type="number" name="min_budget" value="${esc(p.min_budget)}"></div><div><label>Languages</label><input class="input" name="languages" value="${esc((p.languages||[]).join(', '))}"></div><div><label>Geography</label><input class="input" name="geography" value="${esc(p.geography||'Remote')}"></div><div class="span"><label>Hard no / blacklist</label><input class="input" name="blacklist" value="${esc(p.blacklist)}" placeholder="crypto, gambling"></div><div class="span"><button class="btn green">${edit?'Save':'Build my radar'}</button> ${edit?'<a class="btn ghost" href="#app">Cancel</a>':''}<span id="pm" class="msg"></span></div></form></div>`;document.querySelector('#pf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),b=Object.fromEntries(f.entries());b.languages=String(b.languages||'').split(',').map(x=>x.trim()).filter(Boolean);try{await saveProfile(b);location.hash='app'}catch(x){document.querySelector('#pm').textContent=x.message}}}
function shell(){root.innerHTML=`<div class="appbar"><div class="wrap"><div class="brand">Job<b>Scout</b></div><div><button id="refresh" class="btn ghost">Refresh</button> <a class="btn ghost" href="#profile">Profile</a> <button id="logout" class="btn">Log out</button></div></div></div><div class="wrap appmain"><aside class="side"><button data-f="all">For you</button><button data-f="Strong">Strong</button><button data-f="Good">Good</button><button data-f="saved">Saved</button><button data-f="applied">Applied</button></aside><main><div class="eyebrow">Your radar · live</div><h2>Jobs for you</h2><div id="sum" class="summary"></div><div class="toolbar"><input id="search" class="input" placeholder="Search jobs"><span id="sources" class="muted"></span></div><div id="feed" class="empty">Scanning sources…</div></main></div>`;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderFeed()});document.querySelector('#search').oninput=e=>{S.q=e.target.value.toLowerCase();renderFeed()};document.querySelector('#refresh').onclick=async()=>{await loadJobs(true);renderApp()};document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.hash=''}}
function renderFeed(){let a=S.jobs.filter(j=>j.action?.status!=='dismissed');if(S.filter==='Strong'||S.filter==='Good')a=a.filter(j=>j.label===S.filter);if(S.filter==='saved'||S.filter==='applied')a=a.filter(j=>j.action?.status===S.filter);if(S.q)a=a.filter(j=>(j.title+' '+j.company+' '+j.description).toLowerCase().includes(S.q));document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===S.filter));document.querySelector('#feed').className='';document.querySelector('#feed').innerHTML=a.length?a.map(j=>`<div class="job" data-id="${j.id}"><div class="row"><div><div class="meta"><b>${esc(j.source)}</b><span>·</span><span>${ago(j.source_published_at)} ago</span><span>·</span><span>${esc(j.location)}</span></div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)} ${j.salary_text?'· '+esc(j.salary_text):''}</div></div><div class="score">${j.score}%<br><small>${j.label}</small></div></div><p class="desc">${esc((j.description||'').slice(0,420))}</p><div class="chips">${(j.skills||[]).slice(0,8).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}</div><div class="match"><b>Why it matches</b><br>${esc(j.why)}</div><div class="actions"><button class="btn ${j.action?.status==='saved'?'soft':'ghost'}" data-a="saved">${j.action?.status==='saved'?'✓ Saved':'Save'}</button><button class="btn ${j.action?.status==='applied'?'soft':'ghost'}" data-a="applied">${j.action?.status==='applied'?'✓ Applied':'Applied'}</button><button class="btn ghost" data-a="dismissed">Not for me</button><button class="btn primary" data-p="1">Proposal</button><a class="btn ghost" href="${esc(j.url)}" target="_blank" rel="noopener">Open original ↗</a></div></div>`).join(''):'<div class="empty">No jobs here yet.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(Number(b.closest('.job').dataset.id),b.dataset.a));document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>proposalModal(Number(b.closest('.job').dataset.id)))}
function renderApp(){document.querySelector('#sum').innerHTML=`<div class="stat"><span class="muted">Today</span><b>${S.stats.today}</b></div><div class="stat"><span class="muted">Strong</span><b>${S.stats.strong}</b></div><div class="stat"><span class="muted">Good</span><b>${S.stats.good}</b></div><div class="stat"><span class="muted">Proposals</span><b>${S.stats.proposals}</b></div>`;document.querySelector('#sources').textContent=(S.stats.sources||[]).map(x=>x.source+' '+x.count).join(' · ');renderFeed()}
async function proposalModal(id){let j=S.jobs.find(x=>x.id===id),bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal"><div class="row"><h3>${esc(j.title)}</h3><button id="x" class="btn ghost">Close</button></div><div id="pb" class="empty">Generating…</div><div class="actions"><button data-tone="professional" class="btn green">Professional</button><button data-tone="short" class="btn ghost">Shorter</button><button data-tone="casual" class="btn ghost">Casual</button><button id="copy" class="btn ghost hide">Copy</button></div><p class="muted">Profile-aware beta draft. Review before sending.</p></div>`;document.body.append(bg);bg.querySelector('#x').onclick=()=>bg.remove();async function gen(t='professional'){let d=await makeProposal(id,t),box=bg.querySelector('#pb');box.className='';box.innerHTML='<pre>'+esc(d.body)+'</pre>';let c=bg.querySelector('#copy');c.classList.remove('hide');c.onclick=()=>navigator.clipboard.writeText(d.body)}bg.querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>gen(b.dataset.tone));gen()}
async function app(){shell();try{await loadJobs();renderApp()}catch(x){document.querySelector('#feed').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
async function route(){let h=(location.hash||'#').slice(1),{data:{session}}=await sb.auth.getSession();if(!h){landing();return}if(h==='login'||h==='signup'){if(session){await getProfile();location.hash=S.profile?.onboarding_completed?'app':'onboarding';return}auth(h);return}if(!session){location.hash='login';return}if(!S.profile)await getProfile();if(h==='onboarding'){onboarding(false);return}if(h==='profile'){onboarding(true);return}if(h==='app'){if(!S.profile?.onboarding_completed){location.hash='onboarding';return}await app();return}landing()}
window.addEventListener('hashchange',route);sb.auth.onAuthStateChange(()=>route());route();
</script></body></html>
